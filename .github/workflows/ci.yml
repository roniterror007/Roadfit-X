name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ROADFIT_GRAPH: data/koramangala_enriched_v2.graphml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q tests
      - name: Reproducible experiment smoke test
        run: python -m src.evaluation.ablations --graph data/koramangala_bengaluru_karnataka_india_drive.graphml --num-pairs 3 --seeds 41 --missing-rates 0.3 --output experiments/ci/ablations.csv
      - run: python -m src.evaluation.plot_results --csv experiments/ci/ablations.csv
      - name: Anticipatory traffic smoke test
        run: python -m src.evaluation.traffic_benchmark --datasets SiouxFalls --seeds 41 --capacity-scales 0.05 --adoptions 1 --trips 8 --workers 1 --output experiments/ci/traffic
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-smoke
          path: experiments/ci/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
